name: tmp regenerate linux baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: media-docs-refresh-2026-08-10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build deterministic browser fixture
        run: VISUAL_TEST=1 npm run build

      - name: Regenerate Linux baselines
        run: npm run test:visual:update

      - name: Commit regenerated baselines
        run: |
          git config user.name "kartikkabadi"
          git config user.email "kartikkabadi@users.noreply.github.com"
          git add tests/visual/visual.spec.ts-snapshots/
          git diff --cached --quiet || git commit -m "chore: regenerate Linux baselines on ubuntu-latest runner"
          git push origin HEAD:media-docs-refresh-2026-08-10
